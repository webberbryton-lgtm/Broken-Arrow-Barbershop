<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;92px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;team&quot;,&quot;hair&quot;,&quot;shop&quot;,&quot;journal&quot;,&quot;visit&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cartCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1440, open: false };
  componentDidMount() { this.iv = setInterval(this.measure, 500); setTimeout(this.measure, 50);  this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); clearInterval(this.iv); }
  measure = () => { if (this.state.open) return; const el = document.querySelector('header[data-hdr="site"]'); if (!el) return; const h = Math.round(el.getBoundingClientRect().height); if (h && h !== this.state.h) this.setState({ h }); };
  renderVals() {
    const a = this.props.active;
    const items = [
      ['services', 'Services', 'Services.dc.html'],
      ['team', 'The team', 'Team.dc.html'],
      ['hair', 'Hair replacement', 'Hair%20Replacement.dc.html'],
      ['shop', 'Products', 'Shop.dc.html'],
      ['education', 'Education', 'Education.dc.html'],
      ['journal', 'Journal', 'Journal.dc.html'],
      ['apprenticeship', 'Apprenticeship', 'Apprenticeship.dc.html'],
      ['faq', 'FAQ', 'FAQ.dc.html'],
      ['about', 'About us', 'About.dc.html'],
    ];
    const w = this.state.w;
    return {
      nav: items.map(([id, label, href]) => ({ label, href, border: id === a ? 'var(--green)' : 'transparent' })),
      stripWide: w >= 520, stripNarrow: w < 520, wide: w >= 900, narrow: w < 900, spacer: this.state.h ? this.state.h + 'px' : (w >= 900 ? '169px' : '120px'), phone: w < 900, notPhone: w >= 900,
      open: this.state.open, closeMenu: () => { this.setState({ open: false }); document.body.style.overflow = ''; },
      topNav: items.filter(([id]) => !['services', 'team', 'journal', 'about'].includes(id)).map(([id, label, href]) => ({ label, href, border: id === a ? 'var(--green)' : 'transparent' })),
      drawer: items.map(([id, label, href]) => ({ label, href, border: 'transparent' })),
      menuLabel: this.state.open ? 'CLOSE' : 'MENU',
      toggle: () => this.setState(s => ({ open: !s.open })),
      cartLabel: 'CART (' + (this.props.cartCount ?? 0) + ')',
      book: this.props.book || 'https://book.squareup.com/appointments/a9bstwwcb18jn4/location/LFBJAQ8MMHY0Z/services',
      barLabel: this.props.bookLabel || 'BOOK NOW',
    };
  }
}
</script>
