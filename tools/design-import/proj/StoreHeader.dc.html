<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/broken-arrow-design-system-2-3f23b63e-0e93-429d-8b89-f18cee7a4a7d/styles.css">
<script src="_ds/broken-arrow-design-system-2-3f23b63e-0e93-429d-8b89-f18cee7a4a7d/_ds_bundle.js"></script>
<link rel="stylesheet" href="mobile.css">
</helmet>

<div style="height:{{ spacer }}"></div>
<header data-hdr="store" style="position:fixed;top:0;left:0;right:0;z-index:50;background:var(--band);color:var(--on-band)">
  <div style="background:var(--canvas-sunk);color:var(--ink)">
    <div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,5vw,64px);min-height:40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 16px;box-sizing:border-box;text-align:center">
      <p data-m-hide="" style="margin:0;font:500 13px/18px var(--font-sans)">Developed and used at Broken Arrow Barbershop, Orem. Ships anywhere in the US, or pick up at your next appointment.</p>
      <a href="Home.dc.html" style="font:600 12px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:underline;text-decoration-color:var(--green);text-underline-offset:4px" style-hover="color:var(--green)">Book a haircut →</a>
    </div>
  </div>
  <div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,5vw,64px);height:80px;display:flex;align-items:center;justify-content:space-between;gap:24px;box-sizing:border-box">
    <a href="Shop.dc.html" aria-label="Broken Arrow Grooming shop home" style="display:block;flex:none"><img src="assets/logos/lockup-grooming-offwhite.svg" alt="Broken Arrow Grooming" style="width:{{ logoW }};height:auto;display:block"></a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Shop" style="display:flex;align-items:center;gap:24px;min-width:0">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
          <a href="{{ n.href }}" style="font:600 13px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--on-band);text-decoration:none;white-space:nowrap;padding:6px 0;border-bottom:2px solid {{ n.border }}" style-hover="border-bottom-color:var(--on-band)">{{ n.label }}</a>
        </sc-for>
      </nav>
    </sc-if>
    <div style="display:flex;align-items:center;gap:16px;flex:none">
      <sc-if value="{{ notXs }}" hint-placeholder-val="{{ true }}"><a href="Home.dc.html" style="white-space:nowrap;display:flex;align-items:center;min-height:44px;padding:0 18px;background:var(--on-band);color:var(--band);font:600 13px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:background-color 150ms ease,color 150ms ease" style-hover="background:var(--green);color:var(--on-band)">Book a haircut</a></sc-if>
      <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ toggle }}" style="background:none;border:0;cursor:pointer;min-height:44px;padding:0;font:600 13px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--on-band)">{{ menuLabel }}</button>
      </sc-if>
      <a href="#" style="display:flex;align-items:center;min-height:44px;padding:0 {{ cartPad }};border:1px solid var(--line-strong);font:600 13px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--on-band);text-decoration:none;white-space:nowrap;font-variant-numeric:tabular-nums" style-hover="border-color:var(--on-band)">{{ cartLabel }}</a>
    </div>
  </div>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Shop" style="border-top:1px solid var(--line-strong);padding:16px clamp(16px,5vw,64px) 32px;display:flex;flex-direction:column">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
        <a href="{{ n.href }}" onClick="{{ closeMenu }}" style="font:800 32px/1 var(--font-display);letter-spacing:-.03em;text-transform:uppercase;color:var(--on-band);text-decoration:none;padding:16px 0;border-bottom:1px solid var(--line-strong)">{{ n.label }}</a>
      </sc-for>
      <a href="Home.dc.html" class="ba-label" style="margin-top:24px;display:flex;align-items:center;min-height:44px;color:var(--on-band);opacity:.78">Book a haircut at Broken Arrow Barbershop →</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;120px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;all&quot;,&quot;grooming&quot;,&quot;howto&quot;],&quot;default&quot;:&quot;all&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cartCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1440, open: false };
  componentDidMount() { this.iv = setInterval(this.measure, 500); setTimeout(this.measure, 50);  this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); clearInterval(this.iv); }
  measure = () => { if (this.state.open) return; const el = document.querySelector('header[data-hdr="store"]'); if (!el) return; const h = Math.round(el.getBoundingClientRect().height); if (h && h !== this.state.h) this.setState({ h }); };
  renderVals() {
    const a = this.props.active ?? 'all';
    const items = [['all', 'Shop all', 'Shop.dc.html'], ['grooming', 'Grooming', 'Shop.dc.html#shop'], ['quiz', 'Product quiz', 'Product%20Quiz.dc.html'], ['education', 'Education', 'Learn.dc.html'], ['wholesale', 'Wholesale', 'Wholesale.dc.html'], ['about', 'About', 'Grooming%20About.dc.html'], ['barbershop', 'The barbershop', 'Home.dc.html']];
    const w = this.state.w, narrow = w < 1360;
    return {
      nav: items.map(([id, label, href]) => ({ label, href, border: id === a ? 'var(--on-band)' : 'transparent' })),
      wide: !narrow, narrow, open: this.state.open && narrow,
      menuLabel: this.state.open ? 'CLOSE' : 'MENU',
      closeMenu: () => this.setState({ open: false }),
      toggle: () => this.setState(s => ({ open: !s.open })),
      cartLabel: 'CART (' + (this.props.cartCount ?? 0) + ')',
      notXs: w >= 640, logoW: w < 400 ? '136px' : '168px', cartPad: w < 640 ? '12px' : '18px',
      spacer: this.state.h ? this.state.h + 'px' : (w < 640 ? '138px' : '120px'),
    };
  }
}
</script>
</body>
</html>
