<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/broken-arrow-design-system-2-3f23b63e-0e93-429d-8b89-f18cee7a4a7d/styles.css">
<script src="_ds/broken-arrow-design-system-2-3f23b63e-0e93-429d-8b89-f18cee7a4a7d/_ds_bundle.js"></script>
<link rel="stylesheet" href="mobile.css">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}body{margin:0;overflow-x:clip;background:var(--canvas);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
h1,h2,p,ul{margin:0}
a{color:var(--ink);text-decoration-color:var(--green);text-underline-offset:4px}
a:hover{color:var(--green)}
</style>
</helmet>

<dc-import name="SiteHeader" hint-size="100%,92px"></dc-import>

<section data-screen-label="Info / Header" style="background:var(--canvas-sunk);border-bottom:1px solid var(--line)">
  <div style="max-width:920px;margin:0 auto;padding:clamp(48px,7vw,88px) clamp(16px,5vw,64px);display:flex;flex-direction:column;gap:16px">
    <p class="ba-label">{{ p.group }}</p>
    <h1 class="ba-display" style="font-size:min(clamp(44px,6.4vw,80px),11vw);letter-spacing:-.045em">{{ p.title }}</h1>
    <p class="ba-label" style="color:var(--ink-muted)">Last updated {{ p.updated }}</p>
  </div>
</section>

<article data-screen-label="Info / Body" style="max-width:920px;margin:0 auto;padding:clamp(48px,7vw,88px) clamp(16px,5vw,64px);display:flex;flex-direction:column;gap:40px">
  <sc-for list="{{ p.leads }}" as="t" hint-placeholder-count="1">
    <p style="font-size:clamp(19px,1.9vw,22px);line-height:1.6;text-wrap:pretty">{{ t }}</p>
  </sc-for>
  <sc-for list="{{ p.sections }}" as="s" hint-placeholder-count="3">
    <section style="display:flex;flex-direction:column;gap:14px;border-top:2px solid var(--ink);padding-top:24px">
      <h2 style="font:800 clamp(22px,2.4vw,28px)/1.15 var(--font-display);letter-spacing:-.02em;text-transform:uppercase">{{ s.h }}</h2>
      <sc-for list="{{ s.paras }}" as="t" hint-placeholder-count="1">
        <p style="font-size:17px;line-height:28px;text-wrap:pretty">{{ t }}</p>
      </sc-for>
      <sc-if value="{{ s.hasList }}" hint-placeholder-val="{{ false }}">
        <ul style="padding:0 0 0 22px;display:flex;flex-direction:column;gap:6px;font-size:17px;line-height:28px">
          <sc-for list="{{ s.list }}" as="li" hint-placeholder-count="3"><li style="text-wrap:pretty">{{ li }}</li></sc-for>
        </ul>
      </sc-if>
      <sc-for list="{{ s.after }}" as="t" hint-placeholder-count="0">
        <p style="font-size:17px;line-height:28px;text-wrap:pretty">{{ t }}</p>
      </sc-for>
    </section>
  </sc-for>
  <div style="display:flex;flex-direction:column;gap:8px;background:var(--canvas-sunk);padding:24px">
    <p class="ba-label">Contact us</p>
    <p style="font-size:17px;line-height:28px">Broken Arrow Barbershop · 375 E 800 S, Suite 12, Orem, UT 84097</p>
    <p style="font-size:17px;line-height:28px"><a href="tel:+18017091280">(801) 709-1280</a> · <a href="{{ mailto }}">{{ email }}</a></p>
  </div>
</article>

<dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;accessibility&quot;,&quot;privacy&quot;,&quot;terms&quot;,&quot;shipping&quot;,&quot;returns&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;accessibility&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const EMAIL = 'brokenarrowbarbershoporem@gmail.com';
const U = 'September 26, 2026';
const PAGES = {
  accessibility: { group: 'Legal', title: 'Accessibility statement',
    lead: 'We believe the internet should be available and accessible to everyone, and we are committed to providing a website that works for the broadest possible audience, regardless of ability.',
    sections: [
      ['Our commitment to accessibility', ['Broken Arrow Barbershop and Broken Arrow Grooming are committed to making our website’s content accessible and user friendly to everyone. We aim to meet the Web Content Accessibility Guidelines (WCAG) 2.1, Level AA.', 'If you are having difficulty viewing or navigating the content on this website, or notice any content, feature or functionality that you believe is not fully accessible to people with disabilities, please call the shop at (801) 709-1280 or email ' + EMAIL + ' with “Access Barrier” in the subject line. Describe the specific feature you feel is not fully accessible, or share a suggestion for improvement.']],
      ['How we respond', ['We take your feedback seriously and will consider it as we evaluate ways to accommodate all of our customers and our overall accessibility policies. If you have trouble booking online, call the shop during open hours and we’ll book your appointment for you.']],
      ['Third-party content', ['Some parts of this website, such as online booking and checkout, are provided by third parties. While we do not control such vendors, we strongly encourage vendors of third-party digital content to provide content that is accessible and user friendly.']],
    ] },
  privacy: { group: 'Legal', title: 'Privacy policy',
    lead: 'Broken Arrow Grooming (“we,” “us,” or “our”) respects your privacy. This Privacy Policy explains how we collect, use, disclose, and protect your personal information when you visit our website, purchase products, book services, communicate with us, or otherwise interact with our business.',
    sections: [
      ['Information We Collect', ['Depending on how you interact with Broken Arrow Grooming, we may collect information such as:'], ['Your name, email address, phone number, billing address, and shipping address.', 'Order and transaction information, including products purchased and purchase history.', 'Appointment and booking information when you book barbering or grooming services.', 'Communications you send to us, including customer service inquiries.', 'Information about how you use our website, such as your IP address, browser type, device information, pages viewed, and interactions with the site.', 'Information collected through cookies and similar technologies.', 'Marketing and advertising information, including interactions with our advertisements and marketing communications.'], ['Payment information may be processed by third-party payment providers. We generally do not directly store complete payment card information.']],
      ['How We Use Your Information', ['We may use personal information to:'], ['Process and fulfill orders.', 'Provide and manage barbering and grooming appointments.', 'Process payments and refunds.', 'Communicate with you regarding orders, appointments, products, or services.', 'Provide customer support.', 'Improve our website, products, services, and customer experience.', 'Prevent fraud and protect the security of our business and customers.', 'Send marketing communications when permitted by law.', 'Measure the effectiveness of advertising and marketing campaigns.', 'Comply with applicable laws and legal obligations.']],
      ['Applications and Forms', ['When you apply for a free haircut, an apprenticeship or a job, request a hair system consultation, or apply for a wholesale account, we collect the details you enter, such as your name, email address, phone number, city, Instagram handle, photos or links you share, and your answers to our questions.', 'We use this information only to review your application or request and to contact you about it. Form submissions are delivered to our shop inbox through a third-party form service. We do not sell this information or use it for advertising. If you’d like us to delete an application, email us and we will remove it.']],
      ['Shopify', ['Our online store is hosted through Shopify. Shopify may process personal information in connection with providing ecommerce, checkout, hosting, analytics, security, and related services.', 'Shopify’s handling of personal information is governed by its own privacy practices and policies.']],
      ['Appointment Booking', ['We may use third-party booking and payment platforms, including Square, to provide appointment scheduling and related services. When you book an appointment through a third-party service, information you provide may also be collected and processed by that provider according to its own privacy policy.']],
      ['Cookies and Tracking Technologies', ['Our website may use cookies, pixels, analytics tools, and similar technologies to operate the website, remember preferences, understand how visitors use the site, and measure or improve our advertising.', 'Third-party services we use may also place or access cookies and similar technologies in accordance with their own privacy practices.', 'Where required by applicable law, we will provide choices regarding certain cookies and tracking technologies.']],
      ['Advertising and Analytics', ['We may use third-party analytics and advertising services, such as Google or Meta, to understand website traffic, measure advertising performance, and show relevant advertising.', 'These providers may collect information about your interactions with our website and other websites or services, subject to their respective privacy policies and your available privacy choices.']],
      ['How We Share Information', ['We may share personal information with service providers when reasonably necessary to operate our business. These may include:'], ['Shopify and ecommerce service providers.', 'Payment processors.', 'Appointment and scheduling providers.', 'Shipping and fulfillment providers.', 'Website hosting and technology providers.', 'Analytics and advertising providers.', 'Email, SMS, and other communication providers.', 'Professional advisers and service providers.'], ['We may also disclose information when required by law, to protect our legal rights, to prevent fraud or misuse, or as part of a business transaction such as a merger, sale, or transfer of assets.', 'We do not sell personal information for money. Certain advertising or analytics activities, however, may be treated as a “sale,” “sharing,” or targeted advertising under some privacy laws.']],
      ['Marketing Communications', ['If you choose to receive promotional emails or other marketing communications from us, you may unsubscribe using the instructions included in those communications.', 'If we offer SMS/text-message marketing, additional terms and consent requirements may apply. Consent to receive marketing messages is not a condition of purchasing our products or services.']],
      ['Data Retention', ['We retain personal information for as long as reasonably necessary to provide our products and services, maintain appropriate business and transaction records, comply with legal obligations, resolve disputes, and enforce our agreements.']],
      ['Your Privacy Rights', ['Depending on where you live, you may have certain rights regarding your personal information, including the right to request access to, correction of, or deletion of certain information.', 'You may also have rights regarding certain uses or disclosures of personal information for targeted advertising or similar purposes.', 'To submit a privacy request, contact us using the information below. We may need to verify your identity before completing certain requests.']],
      ['Children’s Privacy', ['Our website and services are not directed toward children, and we do not knowingly collect personal information from children in violation of applicable law.']],
      ['Security', ['We use reasonable administrative, technical, and organizational measures designed to protect personal information. However, no internet transmission or electronic storage system can be guaranteed to be completely secure.']],
      ['Third-Party Websites', ['Our website may contain links to third-party websites or services. We are not responsible for the privacy practices, security, or content of those third parties. We encourage you to review their privacy policies before providing personal information.']],
      ['Changes to This Privacy Policy', ['We may update this Privacy Policy periodically to reflect changes to our business, website, services, technology, or legal requirements.', 'When we make changes, we may update the “Last updated” date at the top of this policy.']],
      ['Contact Us', ['If you have questions about this Privacy Policy or would like to submit a privacy request, contact: Broken Arrow Grooming, Orem, Utah, United States. Email: ' + EMAIL + '. Phone: (801) 709-1280.']],
    ] },
  terms: { group: 'Legal', title: 'Terms of service', updated: "October 3, 2026",
    lead: ["These Terms of Service (“Terms”) govern your use of the Broken Arrow Grooming website and your purchase or use of our grooming services, hair replacement services, hair products, other physical merchandise, in-person classes, online courses, and educational materials.", "Broken Arrow Grooming is operated by Broken Arrow Barbershop LLC, located at 375 E 800 S Ste 12, Orem, UT 84097 (“Broken Arrow,” “we,” “us,” or “our”).", "By purchasing from us, booking a service, enrolling in education, or otherwise accepting these Terms, you agree to be bound by them. If you do not agree, please do not make a purchase or use our services."],
    sections: [
      ["1. General Terms", ["You may use our website and services only for lawful purposes. You may not misuse the website, interfere with its operation, attempt unauthorized access, or use our content or services in violation of applicable law.", "You must be legally able to enter into a binding agreement to make a purchase or enroll in a course. A parent or legal guardian must authorize purchases and participation for minors where required.", "You agree to provide accurate contact, billing, shipping, and registration information and to keep that information current.", "We may refuse or discontinue service when reasonably necessary, including in cases involving fraud, abuse, harassment, safety concerns, or violations of these Terms, subject to applicable law and any refund obligations."]],
      ["2. Appointments and Barbering Services", ["Appointments may be booked through our website or a third-party booking provider such as Square.", "Services, prices, appointment lengths, and barber availability may change. Changes will not alter the agreed price of an existing booking without your agreement.", "Please arrive on time. Clients who arrive more than 15 minutes late may need to reschedule if there is not enough remaining time to properly complete the service without affecting other scheduled clients.", "Any cancellation fees, deposits, or no-show charges will be disclosed before booking. These Terms alone do not impose a cancellation or no-show fee.", "Haircuts, beard services, styling, and other grooming services are inherently subjective. Reference photographs and consultations can help communicate a desired result, but we cannot guarantee an exact appearance or an identical result to a photograph.", "Results vary depending on hair type, density, texture, growth patterns, existing condition, previous treatments, and styling or maintenance at home.", "Please tell your barber about relevant allergies, sensitivities, scalp conditions, or other concerns before your service. We may recommend modifying or postponing a service if we identify a safety concern.", "If you have concerns about your service, please contact us promptly so we can discuss an appropriate resolution."]],
      ["3. Hair Replacement Services", ["Hair replacement services may include consultations, system selection, ordering, fitting, cutting, attachment, removal, and maintenance.", "A hair system is a cosmetic service and does not diagnose, treat, or cure hair loss or any medical condition.", "Appearance, comfort, attachment duration, and system lifespan vary based on the system, skin and scalp condition, activity level, maintenance, products used, and other individual factors. Any lifespan or maintenance estimates are estimates unless expressly stated as a written guarantee.", "Clients are responsible for following the care instructions provided and attending recommended maintenance appointments.", "Please disclose known sensitivities to adhesives, tapes, removers, or other products before treatment. If irritation occurs, stop using the affected product and contact us. Seek medical advice when appropriate.", "Prices, deposits, ordering timelines, maintenance costs, and any cancellation or return restrictions for custom or specially ordered systems will be disclosed before you commit to the purchase. Any applicable restrictions remain subject to your rights concerning defective, incorrect, or misrepresented goods."]],
      ["4. Hair Products and Other Physical Merchandise", ["We sell hair and grooming products and may offer tools, accessories, apparel, and other physical merchandise.", "We aim to describe products accurately. Colors and packaging may appear differently on different screens, and packaging may change over time. We will not substitute a materially different product without your agreement.", "Use products only as directed and follow all labels, warnings, and care instructions. Review ingredient information before use, especially if you have known allergies or sensitivities.", "Individual results vary based on hair type, skin type, application, and other factors. Unless expressly stated otherwise, our grooming products are cosmetic products and are not intended to diagnose, treat, cure, or prevent disease.", "Discontinue use if irritation occurs. Contact a qualified healthcare professional if you experience a concerning reaction.", "Products are sold for personal or professional use. Purchasing a product does not authorize you to represent yourself as an approved reseller or distributor of Broken Arrow Grooming."]],
      ["5. Orders, Pricing, and Payment", ["Prices are displayed in U.S. dollars unless otherwise stated. Applicable taxes, shipping charges, and other disclosed fees will be shown before you complete your purchase.", "Payment is due at the time specified during checkout, booking, or enrollment. If we offer installment payments, the payment schedule and any additional conditions will be disclosed before purchase.", "Third-party financing or payment services are subject to the provider’s separate terms.", "An automated order receipt confirms that we received your order. We may cancel an order for reasons such as unavailable inventory, suspected fraud, or a material pricing error. If we cancel an order after payment, we will refund the amount paid for the canceled items, including applicable taxes and any shipping charges attributable to those items.", "If we discover a material error affecting your order, we will contact you and offer the option to proceed on corrected terms or cancel for a refund.", "Price changes apply to future purchases and do not change completed purchases."]],
      ["6. Shipping, Delivery, and Pickup", ["Available shipping methods, charges, and estimated timelines are provided during checkout or in the applicable shipping policy.", "Delivery estimates are not guaranteed arrival dates unless expressly identified as such. We remain responsible for complying with applicable shipping and refund requirements.", "If we cannot ship within the stated shipping timeframe, or within the legally required timeframe when none is stated, we will provide the required delay notice and offer the applicable options to agree to a delay or cancel for a prompt refund.", "Please provide a complete and accurate shipping address. If an order must be reshipped because of an address error you supplied, additional shipping charges may apply after disclosure and your agreement.", "Contact us if your order arrives damaged, contains an incorrect item, or does not arrive. Please retain packaging and provide photographs when reasonably available to help us investigate. A carrier’s delivery scan does not automatically eliminate any rights you may have.", "For local pickup, please follow the instructions provided with your order."]],
      ["7. Returns, Refunds, and Exchanges", ["Any applicable return window, eligibility requirements, exclusions, and responsibility for return shipping will be stated in our Refund and Return Policy or disclosed before purchase.", "Some opened grooming products, used merchandise, custom items, or specially ordered items may be ineligible for change-of-mind returns where that restriction was disclosed before purchase and is permitted by law.", "These restrictions do not remove your rights concerning defective, damaged, incorrect, or misrepresented products, or any other rights that cannot legally be excluded.", "Contact us before returning an item so we can provide the appropriate instructions. Do not send products to a manufacturer or another location unless we instruct you to do so.", "Approved refunds will generally be issued to the original payment method. Processing times may vary by payment provider, subject to any legally required refund timeframe."]],
      ["8. In-Person Classes and Workshops", ["Class descriptions will identify the scheduled date, location, subject matter, price, and any required experience, tools, supplies, or models.", "You are responsible for reviewing those requirements before enrolling and bringing any items identified as your responsibility.", "Any cancellation deadlines, transfer options, deposits, or nonrefundable fees will be disclosed before enrollment. Missing a class or leaving early does not automatically entitle you to a refund, subject to the disclosed policy and applicable law.", "If we cancel a class, you may choose a refund of the amount paid for the canceled class or accept an available replacement date. If we materially change its date or location, you may decline the change and receive a refund.", "Unless expressly included in the purchase, travel and lodging are your responsibility. Consider flexible travel arrangements.", "Participants must follow instructor directions, use tools safely, and treat instructors, models, and other participants respectfully. We may stop unsafe activities or remove a participant for serious misconduct. Any resulting refund will be handled under the disclosed class policy and applicable law.", "Participation does not authorize you to perform services that require a license, permit, or supervision you do not hold."]],
      ["9. Online Courses and Digital Content", ["Online courses may include videos, downloadable resources, demonstrations, live sessions, or community access.", "Your purchase grants you a limited, personal, nonexclusive, nontransferable license to access and use the purchased materials for your own learning and professional development.", "You may apply the skills you learn in your lawful professional practice. You may not copy, record, distribute, sell, sublicense, publicly upload, or share our course materials or account access without our written permission, except as permitted by law.", "Access duration, included materials, live support, and any download permissions will be stated in the course description. A course purchase does not automatically include future courses, private coaching, or every future update.", "You are responsible for having a compatible device and internet connection. Please contact us if you experience an access problem.", "Digital refund eligibility and any restrictions will be disclosed before purchase. If we fail to provide the purchased content or it materially differs from what was advertised, we will address the issue in accordance with applicable law.", "We may update course content while preserving the material features and access period promised at purchase. If we permanently discontinue paid access before the promised period ends, we will provide an appropriate remedy, which may include equivalent access with your agreement or a refund for the undelivered portion."]],
      ["10. Educational Results and Apprenticeships", ["Our education is intended to develop knowledge and practical skills. We do not guarantee a particular skill level, income, employment, business outcome, examination result, or licensing outcome.", "Unless a program expressly states otherwise, a certificate of completion is not a professional license, accreditation, or government-issued qualification.", "Apprenticeships may require a separate application, enrollment agreement, supervision arrangement, and compliance with state licensing requirements. Applying does not guarantee acceptance, employment, or licensure.", "You are responsible for verifying the requirements that apply to your professional activities and location."]],
      ["11. Accounts and Acceptable Conduct", ["Keep your login credentials confidential. Notify us promptly if you suspect unauthorized access.", "You may not share paid course access, impersonate another person, disrupt a class or online community, upload unlawful content, or harass other users.", "We may suspend or terminate access for a material violation of these Terms. Where reasonable, we will provide notice and an opportunity to correct the issue. Refunds, if any, will be determined under the applicable purchase terms and law."]],
      ["12. Intellectual Property and Recording", ["Our branding, website content, photographs, videos, course materials, and other original materials are owned by Broken Arrow or used with permission and are protected by applicable intellectual property laws.", "You may not use our branding or materials in a way that suggests our endorsement or affiliation without permission.", "Purchasing a product or attending a service or class does not automatically give us permission to use your identifiable image, voice, or likeness in advertising. We will obtain separate consent where required for promotional photography or recording.", "Participants may not record classes or other participants without our permission and any required consent from those being recorded."]],
      ["13. Third-Party Services and Privacy", ["Our website may use or link to third-party services for booking, payments, financing, course hosting, or other functions. Those providers may have their own terms and privacy policies.", "We are not responsible for independent third-party websites or services that we do not control. This does not remove our obligations concerning purchases made from us.", "Our Privacy Policy explains how we collect, use, and protect personal information."]],
      ["14. Disclaimers and Limitation of Liability", ["We do not guarantee that the website will operate without interruption or that every service, product, or educational experience will achieve your preferred result.", "To the extent permitted by applicable law, we are not liable for indirect or consequential losses, including lost profits or business opportunities, arising from use of our website, products, services, or education.", "Nothing in these Terms excludes or limits liability for fraud, intentional misconduct, gross negligence, personal injury where liability cannot legally be limited, or any other liability that applicable law does not allow us to exclude or limit.", "Nothing in these Terms waives any mandatory consumer rights, applicable product warranties, or other protections that cannot legally be waived."]],
      ["15. Events Beyond Our Reasonable Control", ["Severe weather, emergencies, transportation disruptions, utility failures, or other events beyond our reasonable control may affect fulfillment or scheduling.", "We will communicate material disruptions and offer appropriate options. These events do not eliminate legally required refunds or other remedies."]],
      ["16. Governing Law and Disputes", ["These Terms are governed by Utah law, subject to any mandatory protections that apply in your place of residence.", "Please contact us first if you have a concern so we can try to resolve it. This does not prevent you from exercising legal rights, filing a claim, or meeting a legal deadline.", "Subject to applicable law, disputes may be brought in a court with jurisdiction in Utah County, Utah. This provision does not override a legally protected right to bring a claim elsewhere."]],
      ["17. Changes to These Terms", ["We may update these Terms by posting a revised version and changing the “Last updated” date.", "Changes apply prospectively. They do not retroactively change the terms of an existing purchase or booking without your agreement, except where required by law.", "For ongoing services, we will provide notice of material changes and obtain consent where required."]],
      ["18. Additional Policies and Severability", ["A clearly disclosed policy or written agreement specific to your purchase, booking, or enrollment controls over these general Terms if there is a conflict, subject to applicable law.", "If a provision is found unenforceable, the remaining provisions will continue in effect to the extent permitted by law."]],
      ["19. Contact Us", ["For questions about these Terms, orders, appointments, products, or education, contact:", "Broken Arrow Grooming", "Operated by: Broken Arrow Barbershop LLC", "Email: brokenarrowbarbershoporem@gmail.com", "Mailing address: 375 E 800 S Ste 12, Orem, UT 84097"]],
    ] },
  shipping: { group: 'Help', title: 'Shipping',
    lead: 'Broken Arrow Grooming ships from our shop in Orem, Utah, to addresses in the United States.',
    sections: [
      ['Processing time', ['Orders ship within 2 business days.']],
      ['Where we ship', ['We currently ship within the United States only.']],

  returns: { group: 'Help', title: 'Returns and exchanges',
    lead: 'If something isn’t right with your order, contact us and we’ll sort it out.',

      ['Returns', ['Unopened products can be returned within 30 days of delivery for a refund to your original payment method. For hygiene reasons, opened products can’t be returned unless they arrived damaged.']],

  contact: { group: 'Help', title: 'Contact us',

};

class Component extends DCLogic {
  key() { return PAGES[this.props.page] ? this.props.page : 'accessibility'; }
  componentDidMount() { this.t(); }
  componentDidUpdate() { this.t(); }
  t() { try { document.title = PAGES[this.key()].title + ' · Broken Arrow Barbershop'; } catch (e) {} }
  renderVals() {
    const p = PAGES[this.key()];
    return { p: { ...p, updated: p.updated || U, leads: Array.isArray(p.lead) ? p.lead : [p.lead], sections: p.sections.map(([h, paras, list, after]) => ({ h, paras, hasList: !!(list && list.length), list: list || [], after: after || [] })) }, email: EMAIL, mailto: 'mailto:' + EMAIL };
  }
}
</script>
